name: Build AOT Query Format V2

on: workflow_call

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Build spring-data-reindexer in AOT mode using query format V2
        run: ./mvnw --batch-mode --update-snapshots clean verify -Pci,nullaway,aot,query-format-v2
